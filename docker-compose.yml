services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maf-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8788
    volumes:
      - ./workspace:/app/workspace
      - ./backend/appsettings.json:/app/appsettings.json:ro
    ports:
      - "8788:8788"

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: maf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
